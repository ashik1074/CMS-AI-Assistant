<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A frontend-only ChatGPT-style chat demo with mock AI responses." />
    <title>AI Assistant (Demo)</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          // Light is the default; dark only when the user picked it.
          var raw = localStorage.getItem('ai-chat:settings:v1');
          if (raw && JSON.parse(raw).theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
